description = Otimizado para logos sem fundo (bg_off) - foca shapes na area opaca
maxPreviewSize = 500
maxResolution = 1024
maxThreads = 0
mutatedSamples = 200
posterizeLevels = 256
previewEvery = 10
randomSamples = 2000
saveAt = 100,250,500,750,1000
saveEvery = 10
stopAt = 1000
redundantCheckEvery = 500
# Extras do ForzaPainter2 (ignorados pelo .exe antigo):
# opaqueOnly=1 -> ignora pixels 100% transparentes no score (economiza ~21% no efr_logo2)
opaqueOnly = 1
alphaThreshold = 10
# maxShapeRadiusDiv=4 -> raio max = min(W,H)/4 (preserva texto pequeno EFR)
maxShapeRadiusDiv = 4
minShapeRadius = 2
mutationRounds = 3
